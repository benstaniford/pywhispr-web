{% extends "base.html" %}

{% block title %}PyWhispr Web{% endblock %}

{% block body %}
<div class="app">
    <header class="topbar">
        <h1>PyWhispr Web</h1>
        <div class="spacer"></div>
        <span class="status" id="status" data-state="checking" title="Active PyWhispr server">
            <span class="dot"></span><span id="status-text">Checking…</span>
        </span>
        <a class="icon-btn" href="{{ url_for('settings') }}" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="3.2"/>
                <path d="M19.9 14.6a1.7 1.7 0 0 0 .35 1.86l.06.07a2 2 0 0 1-2.83 2.83l-.06-.07a1.7 1.7 0 0 0-2.9 1.21V21a2 2 0 0 1-4 0v-.42a1.7 1.7 0 0 0-2.9-1.2l-.06.06a2 2 0 1 1-2.83-2.83l.06-.07A1.7 1.7 0 0 0 3.4 13.7H3a2 2 0 0 1 0-4h.42a1.7 1.7 0 0 0 1.2-2.9l-.06-.06a2 2 0 0 1 2.83-2.83l.07.06a1.7 1.7 0 0 0 2.89-1.2V3a2 2 0 0 1 4 0v.42a1.7 1.7 0 0 0 2.9 1.2l.06-.06a2 2 0 1 1 2.83 2.83l-.06.07a1.7 1.7 0 0 0 1.2 2.89H21a2 2 0 0 1 0 4h-.42a1.7 1.7 0 0 0-1.56 1.05z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </header>

    <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>

    <div class="editor-wrap">
        <textarea id="editor" spellcheck="true" autocapitalize="sentences" aria-label="Transcribed text"
                  placeholder="Tap the microphone and start talking. Your words appear here, at the cursor."></textarea>
    </div>

    <div class="controls">
        <button type="button" class="pill-btn wide" id="copy">Copy</button>
        <div class="record-area">
            <button type="button" id="record" aria-label="Start recording" disabled></button>
            <span class="record-caption" id="record-caption" aria-live="polite"></span>
        </div>
        <button type="button" class="pill-btn wide" id="clear">Clear</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/recorder.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
